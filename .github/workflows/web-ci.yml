name: Web CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

jobs:
  ci:
    name: Web Quality Gates
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Web
        run: pnpm --filter web lint

      - name: Build Web
        run: pnpm --filter web build

  deploy:
    name: Trigger Web Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.WEB_DEPLOY_HOOK
    steps:
      - name: Call deployment webhook
        run: |
          curl -X POST "${{ secrets.WEB_DEPLOY_HOOK }}"
