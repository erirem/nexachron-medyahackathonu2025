name: API CI/CD

on:
  push:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  pull_request:
    branches:
      - main
    paths:
      - 'apps/api/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
  workflow_dispatch:

jobs:
  ci:
    name: API Quality Gates
    runs-on: ubuntu-latest
    env:
      CI: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint API
        run: pnpm --filter api lint

      - name: Test API
        run: pnpm --filter api test -- --runInBand

      - name: Build API
        run: pnpm --filter api build

  deploy:
    name: Trigger API Deployment
    runs-on: ubuntu-latest
    needs: ci
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      secrets.API_DEPLOY_HOOK
    steps:
      - name: Call deployment webhook
        run: |
          curl -X POST "${{ secrets.API_DEPLOY_HOOK }}"
