services:
  # Backend API Service
  - type: web
    name: nexachron-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3001'
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nexachron-web.onrender.com

  # Frontend Web Service
  - type: web
    name: nexachron-web
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    rootDir: apps/web
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3000'
      - key: NEXT_PUBLIC_API_URL
        value: https://nexachron-api.onrender.com
      - key: NODE_ENV
        value: production