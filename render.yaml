services:
  # Backend API Service
  - type: web
    name: nexachron-api
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      curl -fsSL https://get.pnpm.io/install.sh | PNPM_VERSION=10.17.0 SHELL=/bin/bash sh -
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      export HUSKY=0
      pnpm install --frozen-lockfile
      pnpm --filter api... run build
    startCommand: |
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      pnpm --filter api... run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3001'
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nexachron-web.onrender.com
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
  # Frontend Web Service  
  - type: web
    name: nexachron-web
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      curl -fsSL https://get.pnpm.io/install.sh | PNPM_VERSION=10.17.0 SHELL=/bin/bash sh -
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      export HUSKY=0
      pnpm install --frozen-lockfile
      pnpm --filter web... run build
    startCommand: |
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      pnpm --filter web... run start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3000'
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        value: https://nexachron-api.onrender.com
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
