services:
  # Backend API Service
  - type: web
    name: nexachron-api
    runtime: node
    plan: free
    branch: main
    autoDeploy: true
    rootDir: apps/api
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3001'
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nexachron-web.onrender.com
