services:
  # Backend API Service
  - type: web
    name: nexachron-api
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      curl -fsSL https://get.pnpm.io/install.sh | sh -
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      pnpm install --frozen-lockfile
      pnpm --filter api build
    startCommand: |
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      cd apps/api && pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3001'
      - key: DATABASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nexachron-web.onrender.com

  # Frontend Web Service  
  - type: web
    name: nexachron-web
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      curl -fsSL https://get.pnpm.io/install.sh | sh -
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      pnpm install --frozen-lockfile
      pnpm --filter web build
    startCommand: |
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      cd apps/web && pnpm start:prod
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3000'
      - key: NEXT_PUBLIC_API_URL
        value: https://nexachron-api.onrender.com
      - key: NODE_ENV
        value: production
