services:
  # Backend API Service
  - type: web
    name: nexachron-api
    env: node
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: |
      curl -fsSL https://get.pnpm.io/install.sh | sh -
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      pnpm install --frozen-lockfile
      pnpm --filter api build
    startCommand: |
      export PNPM_HOME="/opt/render/project/.pnpm"
      export PATH="$PNPM_HOME:$PATH"
      cd apps/api && pnpm start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: PORT
        value: '3001'
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://nexachron-web.onrender.com
      - key: SUPABASE_URL
        value: https://tfqnfkyntjreanffixtl.supabase.co
